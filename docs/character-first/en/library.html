<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Character First, Exercise Library</title>
<style>
  :root {
    --ink: #1C2433;
    --orange: #f05a28;
    --white: #ffffff;
    --canvas: #FAF7F2;
    --line: #E4DFD6;
    --light-orange: #fff3ef;
    --mist: #F0ECE4; --growth: #1E8A5B; --focus: #2F6FB0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', Arial, sans-serif; background: var(--canvas); color: var(--ink); }

  /* HEADER */
  h1,h2,h3,h4{font-family:'Archivo',system-ui,sans-serif;}
  .header {
    background: var(--ink);
    color: var(--white);
    padding: 32px 48px;
    display: flex; align-items: center; gap: 20px;
  }
  .logo {
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--orange);
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 22px; flex-shrink: 0;
  }
  .header h1 { font-size: 28px; font-weight: 800; }
  .header p { font-size: 14px; opacity: .65; margin-top: 4px; }
  .header-stats { margin-left: auto; display: flex; gap: 24px; text-align: center; }
  .stat-num { font-size: 28px; font-weight: 900; color: var(--orange); }
  .stat-label { font-size: 11px; opacity: .6; }

  /* FILTER BAR */
  .filter-bar {
    background: var(--white);
    border-bottom: 2px solid var(--line);
    padding: 16px 48px;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    position: sticky; top: 0; z-index: 100;
  }
  .filter-label { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; color: #888; margin-right: 4px; }
  .filter-sep { width: 1px; height: 28px; background: var(--border); margin: 0 8px; }
  .filter-btn {
    padding: 6px 14px; border-radius: 20px; border: 1.5px solid var(--line);
    font-size: 12px; font-weight: 700; cursor: pointer; background: var(--white);
    color: #555; transition: all 0.18s; font-family: inherit;
  }
  .filter-btn:hover { border-color: var(--orange); color: var(--orange); }
  .filter-btn.active {
    background: var(--orange); color: var(--white); border-color: var(--orange);
  }
  .filter-search {
    margin-left: auto;
    padding: 6px 14px; border-radius: 20px; border: 1.5px solid var(--line);
    font-size: 13px; font-family: inherit; outline: none;
    min-width: 200px; background: var(--white); color: var(--ink);
    transition: border-color .2s;
  }
  .filter-search:focus { border-color: var(--orange); }
  @media (max-width: 700px) {
    .filter-bar { padding: 12px 16px; }
    .header { padding: 20px 16px; flex-wrap: wrap; }
    .header-stats { display: none; }
    .filter-search { min-width: 120px; }
  }

  /* GRID */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; padding: 24px 48px; }
  @media (max-width: 700px) { .grid { grid-template-columns: 1fr; padding: 16px; } }

  /* CARD */
  .card {
    background: var(--white); border: 1.5px solid var(--line);
    border-radius: 12px; padding: 20px;
    display: flex; flex-direction: column; gap: 10px;
    cursor: pointer; transition: box-shadow .18s, transform .18s, border-color .18s;
    position: relative;
  }
  .card:hover { box-shadow: 0 6px 24px rgba(0,0,0,.10); transform: translateY(-2px); border-color: var(--orange); }
  .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .card-num { font-size: 11px; font-weight: 900; color: var(--orange); letter-spacing: .05em; flex-shrink: 0; }
  .card-title { font-size: 15px; font-weight: 800; line-height: 1.3; flex: 1; }
  .card-desc { font-size: 13px; color: #666; line-height: 1.6; flex: 1; }
  .card-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }
  .tag {
    font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 6px; color: #fff;
    white-space: nowrap;
  }
  .tag-time { background: var(--mist); color: #888; font-weight: 600; }
  .tag-type { background: #e8e2f8; color: #6030a8; }
  .card-expand {
    position: absolute; top: 16px; right: 16px;
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--canvas); border: 1.5px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: #aaa; transition: all .18s;
  }
  .card:hover .card-expand { background: var(--orange); color: #fff; border-color: var(--orange); }

  /* DETAIL PANEL */
  .detail-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5);
    z-index: 500; align-items: flex-start; justify-content: flex-end;
    padding: 0;
  }
  .detail-overlay.open { display: flex; }
  .detail-panel {
    width: 100%; max-width: 560px; height: 100vh;
    background: #fff; overflow-y: auto;
    box-shadow: -8px 0 40px rgba(0,0,0,.18);
    animation: slideIn .25s ease;
  }
  @keyframes slideIn { from { transform: translateX(100%); } to { transform: none; } }
  @media (max-width: 600px) { .detail-panel { max-width: 100%; } }

  .detail-header {
    background: var(--ink); color: var(--white);
    padding: 28px 28px 24px; position: relative;
  }
  .detail-close {
    position: absolute; top: 20px; right: 20px;
    width: 32px; height: 32px; border-radius: 50%;
    background: rgba(255,255,255,.1); border: none; cursor: pointer;
    color: #fff; font-size: 16px; display: flex; align-items: center; justify-content: center;
    transition: background .2s;
  }
  .detail-close:hover { background: rgba(255,255,255,.2); }
  .detail-num { font-size: 12px; font-weight: 800; color: var(--orange); letter-spacing: .06em; margin-bottom: 6px; }
  .detail-title { font-size: 22px; font-weight: 900; line-height: 1.2; margin-bottom: 8px; font-family: 'Archivo', sans-serif; }
  .detail-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }

  .detail-body { padding: 28px; display: flex; flex-direction: column; gap: 24px; }
  .detail-section h3 { font-size: 11px; font-weight: 800; color: #aaa; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 10px; font-family: 'Archivo', sans-serif; }
  .detail-section p { font-size: 14px; color: #444; line-height: 1.75; }
  .detail-section ul { padding-left: 20px; }
  .detail-section ul li { font-size: 14px; color: #444; line-height: 1.75; margin-bottom: 4px; }
  .step-list { list-style: none; padding: 0; counter-reset: steps; }
  .step-list li {
    counter-increment: steps; display: flex; gap: 12px; align-items: flex-start;
    padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; color: #444; line-height: 1.65;
  }
  .step-list li:last-child { border-bottom: none; }
  .step-list li::before {
    content: counter(steps);
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--orange); color: #fff; font-weight: 900; font-size: 12px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px;
  }
  .detail-meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .meta-item { background: var(--canvas); border-radius: 8px; padding: 12px 14px; }
  .meta-label { font-size: 10px; font-weight: 800; color: #aaa; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 4px; }
  .meta-value { font-size: 14px; font-weight: 700; color: var(--ink); }
  .science-box {
    background: #f0f4ff; border: 1.5px solid #c5d3f0; border-radius: 10px;
    padding: 16px 18px;
  }
  .science-box .sci-label { font-size: 10px; font-weight: 800; color: #6080c8; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 6px; }
  .science-box p { font-size: 13px; color: #445; line-height: 1.65; }
  .youtube-link {
    display: flex; align-items: center; gap: 10px; padding: 12px 16px;
    background: #fff0f0; border: 1.5px solid #ffc5c5; border-radius: 10px;
    text-decoration: none; color: #c00; font-size: 14px; font-weight: 700;
    transition: background .18s;
  }
  .youtube-link:hover { background: #ffe0e0; }
  .youtube-icon { font-size: 22px; }

  /* EMPTY STATE */
  .empty-state { grid-column: 1/-1; text-align: center; padding: 60px 20px; color: #aaa; }
  .empty-state p { font-size: 15px; }

  /* RESULTS COUNT */
  .results-bar {
    padding: 10px 48px 0;
    font-size: 12px; color: #999; font-weight: 600;
  }
  @media (max-width: 700px) { .results-bar { padding: 8px 16px 0; } }
</style>

let activeAge = 'all', activeTheme = 'all', searchQ = '';

function renderGrid() {
  const grid = document.getElementById('grid');
  const q = searchQ.toLowerCase();
  const filtered = EXERCISES.filter(ex => {
    const ageOk = activeAge === 'all' || ex.age.includes(activeAge);
    const themeOk = activeTheme === 'all' || ex.theme.includes(activeTheme);
    const searchOk = !q || ex.title.toLowerCase().includes(q) || ex.desc.toLowerCase().includes(q) || ex.theme.toLowerCase().includes(q);
    return ageOk && themeOk && searchOk;
  });
  document.getElementById('results-bar').textContent = filtered.length + ' exercise' + (filtered.length !== 1 ? 's' : '') + ' found';
  if (!filtered.length) {
    grid.innerHTML = '<div class="empty-state"><p>No exercises found. Try different filters.</p></div>';
    return;
  }
  grid.innerHTML = filtered.map(ex => `
    <div class="card" onclick="openDetail(${ex.id})" tabindex="0" onkeydown="if(event.key==='Enter')openDetail(${ex.id})">
      <div class="card-top">
        <span class="card-num">${ex.num}</span>
        <div class="card-expand">&#43;</div>
      </div>
      <div class="card-title">${ex.title}</div>
      <div class="card-desc">${ex.desc}</div>
      <div class="card-tags">
        <span class="tag" style="background:${ex.themeColor}">${ex.theme}</span>
        <span class="tag tag-time">${ex.duration}</span>
        <span class="tag tag-time">${ex.age.join(' / ')}</span>
        <span class="tag tag-type">${ex.type}</span>
      </div>
    </div>
  `).join('');
}

function openDetail(id) {
  const ex = EXERCISES.find(e => e.id === id);
  if (!ex) return;
  document.getElementById('d-num').textContent = ex.num + ' · ' + ex.theme;
  document.getElementById('d-title').textContent = ex.title;
  document.getElementById('d-tags').innerHTML = `
    <span class="tag" style="background:${ex.themeColor}">${ex.theme}</span>
    <span class="tag tag-time">${ex.duration}</span>
    <span class="tag tag-time">${ex.age.join(' / ')}</span>
    <span class="tag tag-type">${ex.type}</span>
  `;
  let bodyHTML = `
    <div class="detail-section">
      <h3>Goal</h3>
      <p>${ex.goal}</p>
    </div>
    <div class="detail-meta-grid">
      <div class="meta-item"><div class="meta-label">Duration</div><div class="meta-value">${ex.duration}</div></div>
      <div class="meta-item"><div class="meta-label">Type</div><div class="meta-value">${ex.type}</div></div>
      <div class="meta-item"><div class="meta-label">Age groups</div><div class="meta-value">${ex.age.join(', ')}</div></div>
      <div class="meta-item"><div class="meta-label">Material</div><div class="meta-value">${ex.material}</div></div>
    </div>
    <div class="detail-section">
      <h3>Step by step</h3>
      <ol class="step-list">${ex.steps.map(s => '<li>' + s + '</li>').join('')}</ol>
    </div>
  `;
  if (ex.science) {
    bodyHTML += `<div class="science-box"><div class="sci-label">Scientific foundation</div><p>${ex.science}</p></div>`;
  }
  if (ex.youtube) {
    bodyHTML += `<a href="${ex.youtube}" target="_blank" class="youtube-link"><span class="youtube-icon">&#9654;</span> Watch on YouTube</a>`;
  }
  document.getElementById('d-body').innerHTML = bodyHTML;
  document.getElementById('detail-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

document.getElementById('detail-close').addEventListener('click', () => {
  document.getElementById('detail-overlay').classList.remove('open');
  document.body.style.overflow = '';
});
document.getElementById('detail-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('detail-overlay')) {
    document.getElementById('detail-overlay').classList.remove('open');
    document.body.style.overflow = '';
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.getElementById('detail-overlay').classList.remove('open');
    document.body.style.overflow = '';
  }
});

document.querySelectorAll('[data-filter]').forEach(btn => {
  btn.addEventListener('click', () => {
    const f = btn.dataset.filter, v = btn.dataset.val;
    if (f === 'age') {
      activeAge = v;
      document.querySelectorAll('[data-filter="age"]').forEach(b => b.classList.remove('active'));
    } else {
      activeTheme = v;
      document.querySelectorAll('[data-filter="theme"]').forEach(b => b.classList.remove('active'));
    }
    btn.classList.add('active');
    renderGrid();
  });
});

document.getElementById('search-input').addEventListener('input', e => {
  searchQ = e.target.value;
  renderGrid();
});

renderGrid();
</script>
