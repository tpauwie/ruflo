// ===== RENDER ENGINE =====
let currentPage = 0;

function renderPage(idx) {
  const p = WEEK_PAGES[idx];
  if (!p) return;
  currentPage = idx;
  const total = WEEK_PAGES.length;
  const pct = ((idx + 1) / total * 100).toFixed(0);
  if (document.getElementById('pgb-fill')) document.getElementById('pgb-fill').style.width = pct + '%';
  if (document.getElementById('pgb-current')) document.getElementById('pgb-current').textContent = idx + 1;

  const isMod = p.type === 'moderator';
  const bgColor = isMod ? '#0a0f1a' : '#FAF7F2';
  const textColor = isMod ? '#e0e6f0' : '#1C2433';

  let sectionsHTML = p.sections.map(s => renderSection(s, isMod)).join('');

  document.getElementById('book-root').innerHTML = `
    <div style="min-height:100vh;background:${bgColor};padding:64px 0 40px;">
      <div style="max-width:760px;margin:0 auto;padding:40px 5%;">

        <div style="display:flex;align-items:center;gap:12px;margin-bottom:32px;">
          <div style="width:44px;height:44px;border-radius:50%;background:${p.themeColor};display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:14px;flex-shrink:0;">D${p.day}</div>
          <div>
            <div style="font-size:11px;font-weight:800;color:${p.themeColor};letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px;">${p.theme} · Day ${p.day} · ${isMod ? 'Moderator Guide' : 'Player Worksheet'}</div>
            <h1 style="font-size:clamp(1.4rem,3vw,2rem);color:${isMod ? '#fff' : '#1C2433'};line-height:1.15;font-family:'Archivo',sans-serif;font-weight:900;">${p.title}</h1>
          </div>
        </div>

        <div style="background:${isMod ? 'rgba(255,255,255,.05)' : '#fff'};border:1px solid ${isMod ? 'rgba(255,255,255,.08)' : '#E4DFD6'};border-radius:12px;padding:20px 24px;margin-bottom:28px;">
          <p style="font-size:.92rem;color:${isMod ? '#8a94a8' : '#6E6A63'};line-height:1.75;">${p.intro}</p>
        </div>

        ${sectionsHTML}

        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:40px;padding-top:24px;border-top:1px solid ${isMod ? 'rgba(255,255,255,.08)' : '#E4DFD6'};">
          <button onclick="goPage(${idx - 1})" ${idx === 0 ? 'disabled' : ''} style="background:${isMod ? '#1a2235' : '#fff'};border:1.5px solid ${isMod ? '#2a3550' : '#E4DFD6'};color:${isMod ? '#8a94a8' : '#6E6A63'};padding:.7rem 1.4rem;border-radius:7px;cursor:pointer;font-family:inherit;font-weight:700;font-size:.85rem;transition:all .2s;" ${idx === 0 ? 'style="opacity:.3;cursor:not-allowed"' : ''}>← Previous</button>
          <span style="font-size:.8rem;color:${isMod ? '#555' : '#aaa'};">${idx + 1} / ${total}</span>
          ${idx < total - 1
            ? `<button onclick="goPage(${idx + 1})" style="background:#F05A28;color:#fff;border:none;padding:.7rem 1.4rem;border-radius:7px;cursor:pointer;font-family:inherit;font-weight:800;font-size:.85rem;transition:background .2s;">Next →</button>`
            : `<a href="worksheets.html" style="background:#1E8A5B;color:#fff;border:none;padding:.7rem 1.4rem;border-radius:7px;text-decoration:none;font-family:'Archivo',sans-serif;font-weight:800;font-size:.85rem;">View all worksheets →</a>`
          }
        </div>
      </div>
    </div>
  `;
  window.scrollTo(0, 0);
}

function renderSection(s, dark) {
  const bg = dark ? 'rgba(255,255,255,.04)' : '#fff';
  const border = dark ? '1px solid rgba(255,255,255,.08)' : '1px solid #E4DFD6';
  const textMain = dark ? '#e0e6f0' : '#1C2433';
  const textSub = dark ? '#6e7a8e' : '#6E6A63';
  const orange = '#F05A28';

  let inner = '';
  switch (s.type) {
    case 'grid5':
      inner = `<p style="font-size:.82rem;color:${textSub};margin-bottom:12px;">${s.label}</p><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;">${s.placeholders.map(p => `<div style="background:${dark?'#0d1320':'#FAF7F2'};border:1.5px dashed ${dark?'#2a3550':'#E4DFD6'};border-radius:8px;padding:12px;text-align:center;font-size:.82rem;color:${textSub};">${p}</div>`).join('')}</div>`;
      break;
    case 'list3':
      inner = `<p style="font-size:.82rem;color:${textSub};margin-bottom:12px;">${s.label}</p><div style="display:flex;flex-direction:column;gap:8px;">${s.placeholders.map((p,i) => `<div style="display:flex;align-items:center;gap:10px;"><div style="width:24px;height:24px;border-radius:50%;background:${orange};color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;flex-shrink:0;">${i+1}</div><div style="flex:1;background:${dark?'#0d1320':'#FAF7F2'};border:1.5px dashed ${dark?'#2a3550':'#E4DFD6'};border-radius:7px;padding:10px 14px;font-size:.82rem;color:${textSub};">${p}</div></div>`).join('')}</div>`;
      break;
    case 'textarea':
      inner = `<p style="font-size:.82rem;color:${textSub};margin-bottom:12px;">${s.label}</p><div style="background:${dark?'#0d1320':'#FAF7F2'};border:1.5px dashed ${dark?'#2a3550':'#E4DFD6'};border-radius:8px;padding:16px;min-height:80px;font-size:.85rem;color:${textSub};line-height:1.75;">${s.placeholder}</div>`;
      break;
    case 'values':
      inner = `<p style="font-size:.82rem;color:${textSub};margin-bottom:12px;">${s.label}</p><div style="display:flex;flex-wrap:wrap;gap:8px;">${s.values.map(v => `<div style="padding:6px 14px;border-radius:20px;border:1.5px solid ${dark?'#2a3550':'#E4DFD6'};font-size:.82rem;font-weight:700;color:${textSub};">${v}</div>`).join('')}</div>`;
      break;
    case 'focus-word':
      inner = `<p style="font-size:.82rem;color:${textSub};margin-bottom:12px;">${s.label}</p><div style="background:${dark?'rgba(240,90,40,.08)':'rgba(240,90,40,.06)'};border:2px dashed ${orange};border-radius:10px;padding:20px;text-align:center;font-size:1.3rem;font-weight:900;color:${orange};letter-spacing:.08em;">${s.placeholder}</div>`;
      break;
    case 'highlight':
      inner = `<p style="font-size:.82rem;color:${textSub};margin-bottom:12px;">${s.label}</p><div style="background:${dark?'rgba(240,90,40,.08)':'rgba(240,90,40,.06)'};border-left:4px solid ${orange};border-radius:0 8px 8px 0;padding:16px 20px;font-size:.92rem;font-style:italic;color:${dark?'#d0d8e8':textMain};line-height:1.75;">${s.placeholder}</div>`;
      break;
    case 'letter':
      inner = `<p style="font-size:.82rem;color:${textSub};margin-bottom:12px;">${s.label}</p><div style="background:${dark?'#0d1320':'#FAF7F2'};border:1.5px dashed ${dark?'#2a3550':'#E4DFD6'};border-radius:8px;padding:16px;font-size:.85rem;color:${textSub};line-height:1.75;font-style:italic;">${s.placeholder}</div>`;
      break;
    case 'timing':
      inner = `<div style="display:flex;flex-direction:column;gap:6px;">${s.items.map(item => `<div style="display:flex;align-items:center;gap:12px;"><span style="background:${orange};color:#fff;font-size:.72rem;font-weight:800;padding:3px 8px;border-radius:4px;min-width:50px;text-align:center;flex-shrink:0;">${item.time}</span><span style="font-size:.88rem;color:${textMain};">${item.desc}</span></div>`).join('')}</div>`;
      break;
    case 'questions':
      inner = `<div style="display:flex;flex-direction:column;gap:8px;">${s.items.map(q => `<div style="display:flex;align-items:flex-start;gap:10px;"><span style="color:${orange};font-weight:900;margin-top:2px;flex-shrink:0;">?</span><p style="font-size:.88rem;color:${textMain};line-height:1.6;">${q}</p></div>`).join('')}</div>`;
      break;
    case 'tips':
      inner = `<div style="display:flex;flex-direction:column;gap:8px;">${s.items.map(t => `<div style="display:flex;align-items:flex-start;gap:10px;"><span style="color:${orange};font-weight:900;margin-top:2px;flex-shrink:0;">✓</span><p style="font-size:.88rem;color:${textMain};line-height:1.6;">${t}</p></div>`).join('')}</div>`;
      break;
    case 'science':
      inner = `<div style="background:${dark?'rgba(47,111,176,.08)':'rgba(47,111,176,.06)'};border:1.5px solid rgba(47,111,176,.2);border-radius:8px;padding:14px 16px;"><p style="font-size:.85rem;color:${dark?'#8ab0d8':'#2F6FB0'};line-height:1.75;">${s.text}</p></div>`;
      break;
    case 'connection':
      inner = `<div style="background:${dark?'rgba(30,138,91,.08)':'rgba(30,138,91,.06)'};border:1.5px solid rgba(30,138,91,.25);border-radius:8px;padding:14px 16px;"><p style="font-size:.85rem;color:${dark?'#5ab88a':'#1E8A5B'};line-height:1.75;">${s.text}</p></div>`;
      break;
    case 'breathing':
      inner = `<p style="font-size:.82rem;color:${textSub};margin-bottom:12px;">${s.label}</p><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;">${s.steps.map((step,i) => `<div style="background:${dark?'rgba(47,111,176,.1)':'rgba(47,111,176,.06)'};border:1.5px solid rgba(47,111,176,.2);border-radius:8px;padding:12px;text-align:center;"><div style="font-size:1.4rem;font-weight:900;color:#2F6FB0;">${i+1}</div><div style="font-size:.75rem;color:${dark?'#8ab0d8':'#2F6FB0'};margin-top:4px;font-weight:700;">${step}</div></div>`).join('')}</div>`;
      break;
    case 'body-map':
      inner = `<p style="font-size:.82rem;color:${textSub};margin-bottom:12px;">${s.label}</p><div style="display:flex;flex-wrap:wrap;gap:8px;">${s.signals.map(sig => `<div style="padding:6px 14px;border-radius:20px;border:1.5px solid rgba(47,111,176,.3);background:rgba(47,111,176,.06);font-size:.8rem;color:#2F6FB0;font-weight:700;">${sig}</div>`).join('')}</div>`;
      break;
    default:
      inner = '';
  }

  return `
    <div style="background:${bg};border:${border};border-radius:12px;padding:20px 24px;margin-bottom:16px;">
      <h3 style="font-size:.88rem;font-weight:800;color:${orange};font-family:'Archivo',sans-serif;margin-bottom:14px;">${s.heading}</h3>
      ${inner}
    </div>
  `;
}

function goPage(idx) {
  if (idx < 0 || idx >= WEEK_PAGES.length) return;
  renderPage(idx);
}

renderPage(0);
</script>

</body>
</html>
